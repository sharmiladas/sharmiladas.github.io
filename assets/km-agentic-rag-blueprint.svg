<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" role="img"><title>Agentic RAG: three layers with explicit authority</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#80728b"/></marker></defs><rect width="880" height="494" fill="#faf8f6"/><text x="30" y="40" fill="#382B46" font-family="Arial,sans-serif" font-size="24" font-weight="700">Agentic RAG: three layers with explicit authority</text><g font-family="Arial,sans-serif"><rect x="30" y="80" width="820" height="100" rx="12" fill="#382B46"/><text x="55" y="107" fill="#f6c784" font-size="17" font-weight="700">1 / KNOWLEDGE FOUNDATION</text><text x="55" y="134" fill="white" font-size="18">Authoritative sources + content models + applicable metadata</text><text x="55" y="160" fill="#e7eeee" font-size="16">Authorize first; preserve IDs, versions, provenance, and lifecycle</text><path d="M440 182 v23" stroke="#80728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="218" width="820" height="100" rx="12" fill="#165A5B"/><text x="55" y="245" fill="#f6c784" font-size="17" font-weight="700">2 / ORCHESTRATION AND EVALUATION</text><text x="55" y="272" fill="white" font-size="18">Plan → retrieve → assemble context → generate → evaluate</text><text x="55" y="298" fill="#e7eeee" font-size="16">Hard gates, bounded retries, risk routing, expert review for ambiguity</text><path d="M440 320 v23" stroke="#80728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="356" width="820" height="100" rx="12" fill="#714928"/><text x="55" y="383" fill="#f6c784" font-size="17" font-weight="700">3 / INTERACTION AND LEARNING</text><text x="55" y="410" fill="white" font-size="18">Cited response or reviewed draft → feedback → source correction</text><text x="55" y="436" fill="#e7eeee" font-size="16">Expose limitations; log evidence; update sources and retest</text></g></svg>