<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" role="img"><title>Structured knowledge: model, control, deliver</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#80728b"/></marker></defs><rect width="880" height="494" fill="#faf8f6"/><text x="30" y="40" fill="#382B46" font-family="Arial,sans-serif" font-size="24" font-weight="700">Structured knowledge: model, control, deliver</text><g font-family="Arial,sans-serif"><rect x="30" y="80" width="820" height="100" rx="12" fill="#382B46"/><text x="55" y="107" fill="#f6c784" font-size="17" font-weight="700">MODEL</text><text x="55" y="134" fill="white" font-size="18">Concepts • tasks • references • reusable components</text><text x="55" y="160" fill="#e7eeee" font-size="16">Stable IDs, applicability, explicit relationships, source evidence</text><path d="M440 182 v23" stroke="#80728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="218" width="820" height="100" rx="12" fill="#165A5B"/><text x="55" y="245" fill="#f6c784" font-size="17" font-weight="700">CONTROL</text><text x="55" y="272" fill="white" font-size="18">Schema validation + source checks + expert exception review</text><text x="55" y="298" fill="#e7eeee" font-size="16">Owners, status, review triggers, version boundaries, approval records</text><path d="M440 320 v23" stroke="#80728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="356" width="820" height="100" rx="12" fill="#714928"/><text x="55" y="383" fill="#f6c784" font-size="17" font-weight="700">DELIVER</text><text x="55" y="410" fill="white" font-size="18">CMS publishing • search • support • downstream retrieval</text><text x="55" y="436" fill="#e7eeee" font-size="16">Reuse the maintained source; preserve context in every output</text></g></svg>